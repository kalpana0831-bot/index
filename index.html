<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Calculator</title>
<style>
body { font: 18px Arial, sans-serif; background: #eee; display: grid; place-items: center; min-height: 100vh; }
main { width: 280px; padding: 16px; background: white; border-radius: 8px; }
#display { width: 100%; box-sizing: border-box; padding: 14px; margin-bottom: 10px; text-align: right; font-size: 28px; }
.keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
button { padding: 14px; font-size: 18px; cursor: pointer; }
.operator { background: #dce8d5; }
</style>
</head><body>
<main>
<input id="display" value="0" readonly aria-label="Calculator display">
<div class="keys">
<button onclick="clearCalculator()">C</button><button class="operator" onclick="setOperator('/')">÷</button><button class="operator" onclick="setOperator('*')">×</button><button class="operator" onclick="setOperator('-')">−</button>
<button onclick="addNumber('7')">7</button><button onclick="addNumber('8')">8</button><button onclick="addNumber('9')">9</button><button class="operator" onclick="setOperator('+')">+</button>
<button onclick="addNumber('4')">4</button><button onclick="addNumber('5')">5</button><button onclick="addNumber('6')">6</button><button onclick="calculate()">=</button>
<button onclick="addNumber('1')">1</button><button onclick="addNumber('2')">2</button><button onclick="addNumber('3')">3</button><button onclick="addDecimal()">.</button>
<button onclick="addNumber('0')">0</button>
 </div></main>
<script>
const display = document.querySelector('#display');
let firstNumber = null, operator = null, startNew = false;
function addNumber(number) { display.value = startNew || display.value === '0' ? number : display.value + number; startNew = false; }
function setOperator(next) { firstNumber = Number(display.value); operator = next; startNew = true; }
function calculate() {
  if (operator === null) return;
  const secondNumber = Number(display.value);
  const result = operator === '+' ? firstNumber + secondNumber : operator === '-' ? firstNumber - secondNumber : operator === '*' ? firstNumber * secondNumber : secondNumber === 0 ? 'Error' : firstNumber / secondNumber;
  display.value = String(result); firstNumber = operator = null; startNew = true;
}
function clearCalculator() { display.value = '0'; firstNumber = operator = null; startNew = false; }
function addDecimal() { if (startNew) { display.value = '0.'; startNew = false; } else if (!display.value.includes('.')) display.value += '.'; }
</script>
</body>
</html>
